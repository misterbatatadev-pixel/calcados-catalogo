<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revisao do Catalogo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Revisao</h1>
        <p id="review-summary">Carregando revisao...</p>
      </div>
      <div class="filters">
        <a class="nav-link" href="/seller.html">Vendedor robo</a>
        <a class="nav-link" href="/">Catalogo</a>
        <a class="nav-link" href="/orders.html">Pedidos</a>
        <a class="nav-link" href="/config.html">Configuracoes</a>
        <button id="approve-ready" type="button">Aprovar prontos</button>
        <select id="review-filter">
          <option value="all">Todos os produtos</option>
          <option value="issues">Somente alertas</option>
          <option value="ready">Prontos</option>
        </select>
        <input id="review-search" type="search" placeholder="Codigo, caixa ou alerta" />
      </div>
    </header>

    <main>
      <section id="review-stats" class="review-stats"></section>
      <section id="review-list" class="review-list"></section>
    </main>

    <script src="/review.js"></script>
  </body>
</html>
