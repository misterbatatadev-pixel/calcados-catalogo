version: "3.8"

services:
  calcados_catalogo:
    image: ${CATALOGO_IMAGE:-ghcr.io/misterbatatadev-pixel/calcados-catalogo:latest}
    environment:
      PORT: "4174"
      # Opcional: habilita analise visual de cores durante importacoes futuras.
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - calcados_catalogo_data:/app/data
    networks:
      - managerNet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=managerNet
        - traefik.http.routers.calcados-catalogo.rule=Host(`${CATALOGO_HOST}`)
        - traefik.http.routers.calcados-catalogo.entrypoints=websecure
        - traefik.http.routers.calcados-catalogo.tls.certresolver=letsencrypt
        - traefik.http.services.calcados-catalogo.loadbalancer.server.port=4174

volumes:
  calcados_catalogo_data:

networks:
  managerNet:
    external: true
